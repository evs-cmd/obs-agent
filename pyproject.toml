[project]
name = "obs-agent"
version = "0.1.0"
description = "AI-powered observability assistant with multi-agent routing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.2.0",
    "litellm>=1.50.0",
    "fastmcp>=2.0.0",
    "jinja2>=3.1.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "opentelemetry-sdk==1.41.1",
    "opentelemetry-instrumentation-logging",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "langgraph-cli[inmem]>=0.1.50",
    "deepeval>=1.5.0",
]
telemetry = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-logging>=0.48b0",
]
ui = [
    # Local DuckDB dashboard over events.jsonl (scripts/dashboard.py)
    "duckdb>=1.1.0",
]
# Optional chat UI shell over POST /ask — not part of the demo stack;
# install ad-hoc if you want it: `pip install -e ".[chat]"`.
chat = [
    "chainlit>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "expensive: tests that call LLMs in the synthesis path (slow, costs $)",
]
